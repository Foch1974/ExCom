<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <rect x="24" y="24" width="208" height="208" rx="44" fill="#0F172A" stroke="#38BDF8" stroke-width="8"/>
  <!-- Outer hexagonal boardroom ring -->
  <polygon points="128,52 194,90 194,166 128,204 62,166 62,90" fill="#1E293B" stroke="#64748B" stroke-width="5" stroke-linejoin="round"/>
  <!-- Spokes from CEO center to 6 council seats -->
  <line x1="128" y1="128" x2="128" y2="52" stroke="#38BDF8" stroke-width="4"/>
  <line x1="128" y1="128" x2="194" y2="90" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="128" y1="128" x2="194" y2="166" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="128" y1="128" x2="128" y2="204" stroke="#10B981" stroke-width="4"/>
  <line x1="128" y1="128" x2="62" y2="166" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="128" y1="128" x2="62" y2="90" stroke="#F43F5E" stroke-width="4"/>
  <!-- Outer seat nodes -->
  <circle cx="128" cy="52" r="10" fill="#38BDF8"/>
  <circle cx="194" cy="90" r="9" fill="#FBBF24"/>
  <circle cx="194" cy="166" r="9" fill="#A78BFA"/>
  <circle cx="128" cy="204" r="10" fill="#10B981"/>
  <circle cx="62" cy="166" r="9" fill="#E2E8F0"/>
  <circle cx="62" cy="90" r="10" fill="#F43F5E"/>
  <!-- Central CEO hub -->
  <circle cx="128" cy="128" r="24" fill="#0F172A" stroke="#F8FAFC" stroke-width="6"/>
  <circle cx="128" cy="128" r="9" fill="#38BDF8"/>
</svg>
